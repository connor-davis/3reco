# =============================================================================
#  3REco - production Docker Compose
#
#  Services:
#    api       the Go binary: the API, WebSocket and the built web app (:8180)
#    postgres  Postgres 18
#    minio     file storage (S3 compatible)
#    docs      documentation site
#
#  Copy .env.example to .env first (deploy.sh does this for you). Put a
#  reverse proxy (Caddy, nginx) in front for HTTPS: app.<domain> goes to
#  127.0.0.1:8180 and docs.<domain> to 127.0.0.1:3001.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    environment:
      THREERECO_ADDR: ":8180"
      THREERECO_DATABASE_URL: postgres://threereco:${POSTGRES_PASSWORD}@postgres:5432/threereco?sslmode=disable
      THREERECO_WEB_ORIGIN: ${THREERECO_WEB_ORIGIN}
      THREERECO_COOKIE_SECURE: "true"
      THREERECO_TRUSTED_PROXIES: ${THREERECO_TRUSTED_PROXIES:-}
      THREERECO_FIELD_KEY: ${THREERECO_FIELD_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_FROM_EMAIL: ${AUTH_FROM_EMAIL}
      THREERECO_S3_ENDPOINT: minio:9000
      THREERECO_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      THREERECO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8180:8180"
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: threereco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: threereco
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threereco"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: docker.io/chainguard/minio:latest
    # Runs as root so it can write the data folder.
    user: "0"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  docs:
    build:
      context: ./web/apps/docs
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
